[project]
name = "es-nl2dsl"
version = "1.0.0"
description = "Natural Language to Elasticsearch DSL Translation Framework"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "ES-NL2DSL Team"},
]
keywords = ["elasticsearch", "dsl", "natural-language", "query-generation", "cybersecurity"]

dependencies = [
    "elasticsearch==8.12.0",
    "pyyaml==6.0.1",
    "orjson==3.10.3",
    "jsonschema==4.23.0",
    "ollama==0.4.2",
    "tiktoken==0.8.0",
    "openai==1.54.5",
    "langchain==0.3.7",
    "langchain-openai==0.2.9",
    "langchain-ollama==0.2.0",
    "langchain-groq==0.2.1",
    "pandas==2.2.2",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
gui = [
    "streamlit==1.36.0",
    "plotly==5.22.0",
    "watchdog==4.0.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
external = [
    "anthropic>=0.21.0",
    "groq>=0.11.0",
    "mistralai>=1.2.3",
]
privacy = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
es-nl2dsl = "src.cli.run_one:main"
es-nl2dsl-gui = "gui.start_gui:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "gui"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"