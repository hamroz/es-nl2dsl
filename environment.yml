name: es-nl2dsl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.1
  - pip=23.3.1
  - pip:
    # Core Elasticsearch & Data Processing
    - elasticsearch==8.11.1
    - orjson==3.10.7
    - pandas==2.2.2
    - numpy==1.26.4
    - PyYAML==6.0.2
    - jsonschema==4.22.0
    - tqdm==4.66.4
    - python-dotenv==1.0.1
    - tabulate==0.9.0
    # External LLM Support
    - openai==1.35.0
    - anthropic==0.30.0
    - google-generativeai==0.8.0
    # Scientific Computing & Statistics
    - scipy==1.11.4
    - scikit-learn==1.3.2
    # Async & HTTP
    - aiohttp==3.9.1
    - aiofiles==23.2.0
    # Testing Framework
    - pytest==7.4.3
    - pytest-asyncio==0.21.1
    # GUI Dependencies (optional)
    - streamlit==1.28.1
    - plotly==5.17.0
    - altair==5.1.2
    - matplotlib==3.8.2
    - seaborn==0.13.0
    - streamlit-ace==0.1.1
    - streamlit-option-menu==0.3.6
    # Auto-installed dependencies
    - python-dateutil==2.9.0.post0
    - pytz==2022.7.1
    - tzdata==2025.2
    - attrs==24.2.0
    - jsonschema-specifications==2024.10.1
    - referencing==0.35.1
    - rpds-py==0.20.1
    - urllib3==2.2.2
    - certifi==2024.7.4
    - elastic-transport==8.17.1

# Additional system requirements:
# - Docker & Docker Compose (for Elasticsearch)
# - Ollama with llama3.1:latest model
# - curl (for API testing)

# Tested versions:
# - Elasticsearch: 8.11.1 (via Docker)
# - Ollama: 0.3.x with llama3.1:latest
# - macOS: 14.5+ or Ubuntu: 20.04+