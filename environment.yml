name: es-nl2dsl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.1
  - pip=23.3.1
  - pip:
    - elasticsearch==8.11.1
    - orjson==3.10.7
    - pandas==2.2.2
    - PyYAML==6.0.2
    - jsonschema==4.22.0
    - tqdm==4.66.4
    - python-dotenv==1.0.1
    - tabulate==0.9.0
    - numpy==1.26.4
    - python-dateutil==2.9.0.post0

# Additional system requirements:
# - Docker & Docker Compose (for Elasticsearch)
# - Ollama with llama3.1:latest model
# - curl (for API testing)

# Tested versions:
# - Elasticsearch: 8.11.1 (via Docker)
# - Ollama: 0.3.x with llama3.1:latest
# - macOS: 14.5+ or Ubuntu: 20.04+