version: "3.8"
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: es8113
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false   # <- this line disables HTTPS on :9200
      - ELASTIC_PASSWORD=ChangeMe_123           # <- bootstrap password for 'elastic'
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: ["9200:9200","9300:9300"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ../data_es:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: es-nl2dsl-redis
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: es-nl2dsl-postgres
    environment:
      - POSTGRES_DB=es_nl2dsl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pwd
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:

