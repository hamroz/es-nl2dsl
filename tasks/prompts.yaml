- id: scan-001
  category: port-scan
  prompt: "Find events labeled malicious on 2017-07-04."
  time_window:
    start: "2017-07-04T00:00:00Z"
    end:   "2017-07-04T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-04T00:00:00Z", "lte": "2017-07-04T23:59:59Z" } } },
            { "term": { "label": "malicious" } }
          ]
        }
      }
    }

- id: scan-002
  category: high-traffic
  prompt: "Find TCP connections with more than 10000 bytes transferred from source IP 10.42.42.1 between July 3-5, 2017."
  time_window:
    start: "2017-07-03T00:00:00Z"
    end:   "2017-07-05T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-03T00:00:00Z", "lte": "2017-07-05T23:59:59Z" } } },
            { "term": { "src_ip": "10.42.42.1" } },
            { "term": { "protocol": "TCP" } },
            { "range": { "bytes_out": { "gt": 10000 } } }
          ]
        }
      }
    }

