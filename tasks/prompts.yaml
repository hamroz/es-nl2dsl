- id: scan-001
  category: port-scan
  prompt: "Find events labeled malicious on 2017-07-04."
  time_window:
    start: "2017-07-04T00:00:00Z"
    end:   "2017-07-04T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-04T00:00:00Z", "lte": "2017-07-04T23:59:59Z" } } },
            { "term": { "label": "malicious" } }
          ]
        }
      }
    }

- id: scan-002
  category: high-traffic
  prompt: "Find TCP connections with more than 10000 bytes transferred from source IP 10.42.42.1 between July 3-5, 2017."
  time_window:
    start: "2017-07-03T00:00:00Z"
    end:   "2017-07-05T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-03T00:00:00Z", "lte": "2017-07-05T23:59:59Z" } } },
            { "term": { "src_ip": "10.42.42.1" } },
            { "term": { "protocol": "TCP" } },
            { "range": { "bytes_out": { "gt": 10000 } } }
          ]
        }
      }
    }

- id: scan-003
  category: port-targeting
  prompt: "Find all traffic to destination port 445 or 3389 on July 4, 2017."
  time_window:
    start: "2017-07-04T00:00:00Z"
    end:   "2017-07-04T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-04T00:00:00Z", "lte": "2017-07-04T23:59:59Z" } } },
            { "terms": { "dst_port": [445, 3389] } }
          ]
        }
      }
    }

- id: scan-004
  category: data-exfiltration
  prompt: "Find UDP traffic with high outbound bytes (more than 50000) from internal IPs (10.x.x.x) on July 4, 2017."
  time_window:
    start: "2017-07-04T00:00:00Z"
    end:   "2017-07-04T23:59:59Z"
  expert_dsl: |
    {
      "query": {
        "bool": {
          "filter": [
            { "range": { "@timestamp": { "gte": "2017-07-04T00:00:00Z", "lte": "2017-07-04T23:59:59Z" } } },
            { "term": { "protocol": "UDP" } },
            { "range": { "bytes_out": { "gt": 50000 } } }
          ]
        }
      }
    }
