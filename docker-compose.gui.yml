# Docker Compose for ES-NL2DSL with GUI
version: '3.8'

services:
  # Elasticsearch service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: es-nl2dsl-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=ChangeMe_123
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - es-nl2dsl
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:ChangeMe_123 -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Ollama service for LLM
  ollama:
    image: ollama/ollama:latest
    container_name: es-nl2dsl-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - es-nl2dsl
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ES-NL2DSL GUI Application
  es-nl2dsl-gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    container_name: es-nl2dsl-gui
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data_raw:/app/data_raw
      - ./tasks:/app/tasks
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker operations
    networks:
      - es-nl2dsl
    environment:
      - ES_HOST=elasticsearch:9200
      - OLLAMA_HOST=ollama:11434
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  es_data:
    driver: local
  ollama_data:
    driver: local

networks:
  es-nl2dsl:
    driver: bridge